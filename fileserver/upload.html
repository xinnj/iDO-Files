<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/tabler-icons.min.css">
    <link rel="stylesheet" href="css/toast.css">
    <link rel="stylesheet" href="css/admin.css?v=1">
    <link rel="icon" href="images/favicon.png" type="image/png">
    <style>
        /* Shell styles live in css/admin.css. This block holds what is specific
           to this page. */

        /* Page width — .container and .footer-buttons both read it. See css/admin.css.
           1200px, matching housekeeping and access-control, so the fixed footer bar is
           the same width on all three. This used to be 800px on the reasoning that an
           upload dropzone does not want width, which had the side effect of making this
           page's bar 400px narrower than its siblings' for no reason the user could see.
           The bar cannot be widened on its own: it is sized against the cards, so
           widening only the bar puts its rounded corners 200px past them on each side.
           The cards widen with it — that is the point, not a side effect. */
        :root {
            --page-max: 1200px;
        }

        /* Centred and capped at 800px -- the width the whole page used to be -- because
           the page is 1200px now (see the :root block) so the footer bar matches its
           siblings', and a dashed drop target holding one line of centred text does not
           want 1110px of it. Only the dropzone is capped: the card, the upload stats and
           the file list all keep the full width, since the file list is what benefits
           from it. `margin: 0 auto 20px` rather than a longhand pair so the existing
           bottom margin is kept by the same declaration that centres it. */
        .upload-area {
            border: 2px dashed #d1d7e0;
            border-radius: 8px;
            padding: 40px 20px;
            text-align: center;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
            max-width: 800px;
            margin: 0 auto 20px;
        }

        .upload-area:hover {
            border-color: #4a6fc8;
            background-color: #e9f0ff;
        }

        .upload-area.dragover {
            border-color: #4a6fc8;
            background-color: #e3f2fd;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            color: #6c757d;
            margin-bottom: 15px;
        }

        /* This page's markup uses bare <i> elements rather than Bootstrap's me-*
           utilities, so icon spacing is its own concern — it is deliberately not
           in admin.css, where it would double-space the other pages' icons. */
        .upload-icon,
        .base-url-label i,
        .btn i {
            margin-right: 8px;
        }

        .upload-text {
            font-size: 1.1rem;
            color: #495057;
            margin-bottom: 10px;
        }

        .upload-hint {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 20px;
        }

        .file-input {
            display: none;
        }

        .upload-btn {
            background: linear-gradient(45deg, #4a6fc8, #7185f0);
            border: none;
            color: white;
            padding: 0.6rem 1.5rem;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-inline: 10px;
        }

        .upload-btn i {
            margin-right: 6px;
        }

        .upload-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(74, 111, 200, 0.3);
        }

        .file-list {
            margin-top: 20px;
        }

        .file-item {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .file-info {
            display: flex;
            align-items: center;
            flex: 1;
        }

        .file-icon {
            margin-right: 10px;
            font-size: 1.1rem;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 500;
            color: #333;
            margin-bottom: 2px;
        }

        .file-size {
            font-size: 0.8rem;
            color: #6c757d;
            margin-left: 10px;
        }

        .progress-container {
            width: 150px;
            margin: 0 15px;
        }

        .progress {
            height: 8px;
            border-radius: 4px;
            background-color: #e9ecef;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #4a6fc8, #7185f0);
            transition: width 0.3s ease;
            width: 0%;
        }

        .file-status {
            font-size: 0.8rem;
            min-width: 60px;
            text-align: center;
        }

        .status-pending {
            color: #6c757d;
        }

        .status-uploading {
            color: #ffc107;
        }

        .status-success {
            color: #28a745;
        }

        .status-error {
            color: #dc3545;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-left: 10px;
        }

        .remove-btn:hover {
            background: #c82333;
        }

        /* .footer-buttons lives entirely in css/admin.css now, which centres it
           at 1200px like the other pages. The JS here reads its offsetHeight to
           pad the body, and that is unaffected by the width change. */

        .upload-stats {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            text-align: center;
            margin-bottom: 10px;
        }

        .stat-item {
            flex: 1;
        }

        .stat-number {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4a6fc8;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 2px;
        }

        /* 新增样式：显示上传基础 URL */
        .base-url-section {
            background: white;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .base-url-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 5px;
        }

        .base-url-value {
            font-family: monospace;
            font-size: 0.9rem;
            color: #007bff;
            word-break: break-all;
            background-color: #f8f9fa;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #e0e0e0;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header-section text-center mb-4">
        <h2><i class="ti ti-upload"></i> File Upload</h2>
        <p>Upload multiple files or folders</p>
    </div>

    <!-- Notification Alert - Using toast.js instead -->

    <!-- Base URL Display -->
    <div class="base-url-section">
        <div class="base-url-label">
            <i class="ti ti-link"></i>Upload To
        </div>
        <div class="base-url-value" id="baseUrlValue">
        </div>
    </div>

    <!-- Upload Area -->
    <div class="card">
        <div class="card-body">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">
                    <i class="ti ti-cloud-upload"></i>
                </div>
                <div class="upload-text">Drag & Drop Files or Folders Here</div>
                <div class="upload-hint">or click button to browse files</div>
                <button class="upload-btn" type="button" onclick="document.getElementById('fileInput').click()">
                    <i class="ti ti-file"></i>Select Files
                </button>
                <button class="upload-btn" type="button" onclick="document.getElementById('folderInput').click()">
                    <i class="ti ti-folder"></i>Select Folders
                </button>

                <input type="file" id="fileInput" class="file-input" multiple>
                <input type="file" id="folderInput" class="file-input" multiple webkitdirectory directory>
            </div>

            <!-- Upload Stats -->
            <div class="upload-stats" id="uploadStats" style="display: none;">
                <div class="stats-row">
                    <div class="stat-item">
                        <div class="stat-number" id="totalFiles">0</div>
                        <div class="stat-label">Total Files</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="uploadedFiles">0</div>
                        <div class="stat-label">Uploaded</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="successFiles">0</div>
                        <div class="stat-label">Success</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-number" id="errorFiles">0</div>
                        <div class="stat-label">Errors</div>
                    </div>
                </div>
            </div>

            <!-- File List -->
            <div class="file-list" id="fileList"></div>
        </div>
    </div>

    <!-- Footer Buttons -->
    <div class="footer-buttons">
        <!-- Lives inside the fixed footer so it is always visible and grows the
             footer upward without a magic offset. It must NOT go inside
             #fileList, which is rebuilt on every progress tick. -->
        <div id="sessionAlert" class="alert alert-danger d-none mb-2" role="alert" tabindex="-1">
            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <i class="ti ti-alert-circle me-2"></i>
                    <span id="sessionAlertMessage"></span>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <a class="btn btn-sm btn-light" id="sessionLoginLink" target="_blank"
                       rel="noopener noreferrer">
                        <i class="ti ti-lock"></i>Log in
                    </a>
                    <button type="button" class="btn-close" aria-label="Close"
                            onclick="hideSessionAlert()"></button>
                </div>
            </div>
        </div>
        <div class="d-flex justify-content-center flex-wrap gap-5">
            <button class="btn btn-outline-secondary" onclick="clearAllFiles()">
                <i class="ti ti-trash"></i>Clear All
            </button>
            <button class="btn btn-success" id="uploadButton" onclick="startUpload()" disabled>
                <i class="ti ti-upload"></i>Start Upload
            </button>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container"></div>
</div>

<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/toast.js"></script>
<script src="js/session.js"></script>
<script>
    let selectedFiles = [];
    let uploadStats = {
        total: 0,
        uploaded: 0,
        success: 0,
        errors: 0
    };

    // In-flight XHRs. Every selected file uploads in parallel, so this has to be
    // a registry -- the single-scalar approach used on the file-browser page
    // cannot express it.
    let inFlight = [];

    // Set when the session dies mid-batch. Stops anything new from starting,
    // keeps the queue so it can be retried, and suppresses the completion
    // summary until then.
    let sessionExpired = false;

    let heartbeatTimer = null;
    let recoveryWatching = false;

    // Collapses the re-render that each in-flight abort would otherwise trigger
    // into a single one; aborting 500 uploads would otherwise rebuild the whole
    // file list 500 times.
    let suppressRender = false;

    // Overridable so tests can use a short interval. See window.UPLOAD_HEARTBEAT_MS.
    const HEARTBEAT_MS = window.UPLOAD_HEARTBEAT_MS || 30000;

    // Distinct from session.js's generic message: the queue survives here, so
    // the advice is to log in and retry rather than to refresh.
    const UPLOAD_SESSION_EXPIRED_MSG = 'Session expired. Log in, then click Retry remaining.';

    // DOM Elements
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const folderInput = document.getElementById('folderInput');
    const fileList = document.getElementById('fileList');
    const uploadButton = document.getElementById('uploadButton');
    const uploadStatsDiv = document.getElementById('uploadStats');
    const baseUrlValue = document.getElementById('baseUrlValue');
    const sessionAlertEl = document.getElementById('sessionAlert');
    const sessionAlertMessage = document.getElementById('sessionAlertMessage');
    const sessionLoginLink = document.getElementById('sessionLoginLink');
    const footerEl = document.querySelector('.footer-buttons');

    document.addEventListener('DOMContentLoaded', () => {
        let baseUrl;

        // Prefer explicit upload_to query parameter (most reliable)
        const params = new URLSearchParams(window.location.search);
        const uploadTo = params.get('upload_to');
        if (uploadTo) {
            baseUrl = uploadTo;
        } else {
            // Fall back to referrer URL
            baseUrl = document.referrer;

            // Last resort: use own URL (direct access)
            if (!baseUrl || baseUrl === '') {
                baseUrl = window.location.href;
            }
        }

        // Strip query string and hash, keep only the directory path
        try {
            const parsed = new URL(baseUrl);
            let cleanPath = parsed.pathname;
            if (!cleanPath.endsWith('/')) {
                const lastSegment = cleanPath.split('/').pop();
                if (lastSegment && lastSegment.includes('.')) {
                    cleanPath = cleanPath.substring(0, cleanPath.lastIndexOf('/') + 1);
                } else {
                    cleanPath += '/';
                }
            }
            baseUrl = parsed.origin + cleanPath;
        } catch (e) {
            baseUrl = baseUrl.split('?')[0].split('#')[0];
            if (!baseUrl.endsWith('/')) {
                baseUrl += '/';
            }
        }

        // Display the base URL
        baseUrlValue.textContent = decodeURIComponent(baseUrl);
        baseUrlValue.title = "Files will be uploaded relative to this URL.";
    });

    // Event Listeners
    uploadArea.addEventListener('dragover', handleDragOver);
    uploadArea.addEventListener('dragleave', handleDragLeave);
    uploadArea.addEventListener('drop', handleDrop);
    fileInput.addEventListener('change', handleFileSelect);
    folderInput.addEventListener('change', handleFileSelect);

    // Drag and Drop Handlers
    function handleDragOver(e) {
        e.preventDefault();
        e.stopPropagation();
        uploadArea.classList.add('dragover');
        e.dataTransfer.dropEffect = 'copy';
    }

    function handleDragLeave(e) {
        e.preventDefault();
        e.stopPropagation();
        uploadArea.classList.remove('dragover');
    }

    async function handleDrop(e) {
        e.preventDefault();
        e.stopPropagation();
        uploadArea.classList.remove('dragover');

        const items = e.dataTransfer.items;
        const files = e.dataTransfer.files;
        let allFiles = [];

        // Modern browser support (files + folders)
        if (items && items.length > 0) {
            for (const item of items) {
                const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;

                if (entry) {
                    if (entry.isFile) {
                        const file = await getFileFromEntry(entry);
                        file.relativePath = entry.fullPath || entry.name;
                        allFiles.push(file);
                    } else if (entry.isDirectory) {
                        const dirFiles = await scanDirectory(entry);
                        allFiles = allFiles.concat(dirFiles);
                    }
                }
            }
        }
        // Fallback for files only
        else if (files && files.length > 0) {
            allFiles = Array.from(files);
        }

        if (allFiles.length > 0) {
            addFiles(allFiles);
        }
    }

    // Helper functions
    async function getFileFromEntry(fileEntry) {
        return new Promise((resolve) => {
            fileEntry.file(file => resolve(file));
        });
    }

    async function scanDirectory(directoryEntry) {
        const reader = directoryEntry.createReader();
        let allFiles = [];

        return new Promise(async (resolve) => {
            const readEntries = async () => {
                const entries = await new Promise(res => reader.readEntries(res));

                if (entries.length === 0) {
                    resolve(allFiles);
                    return;
                }

                for (const entry of entries) {
                    if (entry.isFile) {
                        const file = await getFileFromEntry(entry);
                        file.relativePath = entry.fullPath || `${directoryEntry.name}/${entry.name}`;
                        allFiles.push(file);
                    } else if (entry.isDirectory) {
                        const subFiles = await scanDirectory(entry);
                        allFiles = allFiles.concat(subFiles);
                    }
                }

                await readEntries();
            };

            await readEntries();
        });
    }

    function handleFileSelect(e) {
        const files = Array.from(e.target.files);
        if (files.length > 0) {
            addFiles(files);
        }
    }

    function addFiles(files) {
        files.forEach(file => {
            // 对于文件夹上传，附加相对路径
            let filePath = file.name;
            if (file.webkitRelativePath) {
                filePath = file.webkitRelativePath;
            } else if (file.relativePath) {
                filePath = file.relativePath;
            }

            selectedFiles.push({
                file: file,
                name: file.name,
                path: filePath,
                id: Date.now() + Math.random(),
                status: 'pending',
                progress: 0
            });
        });

        render();
    }

    function updateFileList() {
        fileList.innerHTML = '';

        selectedFiles.forEach((item, index) => {
            const fileItem = createFileItem(item, index);
            fileList.appendChild(fileItem);
        });
    }

    function createFileItem(item, index) {
        const iconClass = item.file.type && item.file.type.startsWith('image/') ? 'ti ti-photo' :
            item.file.type && item.file.type.startsWith('video/') ? 'ti ti-video' :
                item.file.type && item.file.type.startsWith('audio/') ? 'ti ti-music' :
                    item.file.type && item.file.type.includes('pdf') ? 'ti ti-file-type-pdf' :
                        item.file.type && item.file.type.includes('zip') || item.file.type && item.file.type.includes('rar') ? 'ti ti-file-zip' :
                            'ti ti-file';

        const statusClass = getStatusClass(item.status);
        const statusText = getStatusText(item.status);

        // Not to show the leading slash
        let filePath = item.path;
        filePath = filePath.startsWith('/') ? filePath.slice(1) : filePath

        const fileItem = document.createElement('div');
        fileItem.className = 'file-item';
        fileItem.innerHTML = `
            <div class="file-info">
                <i class="${iconClass} file-icon"></i>
                <div class="file-details">
                    <div class="file-name">${filePath}</div>
                    <div class="file-size text-muted small">${formatFileSize(item.file.size)}</div>
                </div>
            </div>
            <div style="display: flex; align-items: center;">
                <div class="progress-container">
                    <div class="progress">
                        <div class="progress-bar" style="width: ${item.progress}%"></div>
                    </div>
                </div>
                <div class="file-status ${statusClass}">${statusText}</div>
                <button class="remove-btn" onclick="removeFile(${index})">
                    <i class="ti ti-x"></i>
                </button>
            </div>
        `;
        return fileItem;
    }

    function getStatusClass(status) {
        const classes = {
            'pending': 'status-pending',
            'uploading': 'status-uploading',
            'success': 'status-success',
            'error': 'status-error'
        };
        return classes[status] || 'status-pending';
    }

    function getStatusText(status) {
        const texts = {
            'pending': 'Pending',
            'uploading': 'Uploading',
            'success': 'Success',
            'error': 'Error'
        };
        return texts[status] || 'Pending';
    }

    function formatFileSize(bytes) {
        if (bytes === 0) return '0 Bytes';
        const k = 1024;
        const sizes = ['Bytes', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // IMPORTANT: keep this derived -- it recomputes from selectedFiles on every
    // call and never increments. That is the only reason late-arriving 200s,
    // aborts and retries cannot drift the counts. Turning it into
    // `uploadStats.success++` would make the whole retry flow subtly wrong.
    function updateUploadStats() {
        uploadStats.total = selectedFiles.length;
        uploadStats.uploaded = selectedFiles.filter(f => f.status === 'uploading' || f.status === 'success' || f.status === 'error').length;
        uploadStats.success = selectedFiles.filter(f => f.status === 'success').length;
        uploadStats.errors = selectedFiles.filter(f => f.status === 'error').length;

        if (uploadStats.total > 0) {
            uploadStatsDiv.style.display = 'block';
            document.getElementById('totalFiles').textContent = uploadStats.total;
            document.getElementById('uploadedFiles').textContent = uploadStats.uploaded;
            document.getElementById('successFiles').textContent = uploadStats.success;
            document.getElementById('errorFiles').textContent = uploadStats.errors;
        } else {
            uploadStatsDiv.style.display = 'none';
        }
    }

    function pendingCount() {
        return selectedFiles.filter(f => f.status === 'pending').length;
    }

    // The single owner of the button's label and enabled state, so concurrent
    // handlers cannot fight over it.
    function updateUploadButton() {
        const pending = pendingCount();

        if (inFlight.length > 0) {
            uploadButton.disabled = true;
            uploadButton.innerHTML = '<i class="ti ti-loader"></i>Uploading...';
            return;
        }

        // A file that failed for a real reason stays 'error' and is never
        // retried, so only 'pending' files count -- otherwise the label would
        // promise more than the retry delivers.
        const attempted = selectedFiles.some(f => f.status === 'success' || f.status === 'error');
        if (pending > 0 && (sessionExpired || attempted)) {
            uploadButton.disabled = false;
            uploadButton.innerHTML = '<i class="ti ti-refresh"></i>Retry remaining (' + pending + ')';
            return;
        }

        // Nothing pending means there is nothing to start; this also stops
        // "Retry remaining (0)" from ever rendering.
        uploadButton.disabled = pending === 0;
        uploadButton.innerHTML = '<i class="ti ti-upload"></i>Start Upload';
    }

    // Every state change funnels through here so the list, the stats and the
    // button can never disagree with each other.
    function render() {
        if (suppressRender) return;
        updateFileList();
        updateUploadStats();
        updateUploadButton();
    }

    function removeFile(index) {
        selectedFiles.splice(index, 1);
        if (selectedFiles.length === 0) {
            clearAllFiles();
            return;
        }
        render();
    }

    function clearAllFiles() {
        stopHeartbeat();
        stopRecoveryWatch();
        sessionExpired = false;
        hideSessionAlert();
        abortAllInFlight();
        selectedFiles = [];
        render();
        fileInput.value = '';
        folderInput.value = '';
    }

    // Extract the URL prefix from the base URL to construct API endpoint URLs.
    // Returns "<origin><prefix>" (no trailing slash), or null if the base URL
    // cannot be parsed.
    function getBucketPrefix() {
        let url;
        try {
            url = new URL(baseUrlValue.textContent);
        } catch (e) {
            return null;
        }
        const path = url.pathname;
        const buckets = ['/download/', '/archive/', '/public/'];
        for (let i = 0; i < buckets.length; i++) {
            const idx = path.indexOf(buckets[i]);
            if (idx !== -1) {
                return url.origin + path.substring(0, idx);
            }
        }
        return url.origin;
    }

    function getUserinfoUrl() {
        const prefix = getBucketPrefix();
        return prefix === null ? null : prefix + '/fileserver/userinfo';
    }

    function getLoginUrl() {
        const prefix = getBucketPrefix();
        return prefix === null ? null : prefix + '/fileserver/login';
    }

    function setLoginLink() {
        const loginUrl = getLoginUrl();
        if (loginUrl) {
            sessionLoginLink.href = loginUrl;
            sessionLoginLink.classList.remove('d-none');
        } else {
            // Better no link at all than a dead one.
            sessionLoginLink.classList.add('d-none');
        }
    }

    function showSessionAlert(message, restored) {
        const wasHidden = sessionAlertEl.classList.contains('d-none');

        // Mutate the inner text, not just the container's visibility: toggling
        // display on a container whose text was already present is announced
        // inconsistently by screen readers.
        sessionAlertMessage.textContent = message;
        sessionAlertEl.classList.toggle('alert-danger', !restored);
        sessionAlertEl.classList.toggle('alert-success', !!restored);
        sessionAlertEl.classList.remove('d-none');

        // The alert makes the fixed footer taller, which would otherwise cover
        // the last rows of the list -- exactly when they matter most.
        document.body.style.paddingBottom = (footerEl.offsetHeight + 20) + 'px';

        // Only on the first reveal, or every concurrent 401 steals focus.
        if (wasHidden) sessionAlertEl.focus();
    }

    function hideSessionAlert() {
        sessionAlertEl.classList.add('d-none');
        document.body.style.paddingBottom = '';
    }

    // Stop everything the moment the session is known to be dead.
    //
    // Deliberately has NO early-return guard: every step below is idempotent, so
    // calling this twice is harmless, but a guard would swallow the UI refresh
    // that the retry path needs.
    function enterSessionExpired() {
        sessionExpired = true;   // latch first, so every callback below sees it
        stopHeartbeat();
        abortAllInFlight();
        setLoginLink();
        showSessionAlert(UPLOAD_SESSION_EXPIRED_MSG);
        updateUploadButton();    // last: it owns the label, so it must win
        startRecoveryWatch();
    }

    function abortAllInFlight() {
        // Snapshot: the abort listeners mutate inFlight as they run.
        const snapshot = inFlight.slice();
        suppressRender = true;
        snapshot.forEach(function (xhr) {
            try {
                xhr.abort();
            } catch (e) {
                // Already finished; nothing to do.
            }
        });
        suppressRender = false;
        // Safe whether abort dispatch was synchronous (listeners already drained
        // the array) or asynchronous (they will find nothing to remove).
        inFlight.length = 0;
        render();
    }

    // Poll the session while a batch is running, so uploads stop before the next
    // one fails rather than after.
    function startHeartbeat() {
        stopHeartbeat();
        heartbeatTimer = setInterval(function () {
            // Self-terminating, so a forgotten stopHeartbeat() elsewhere cannot
            // leave an interval running forever.
            if (sessionExpired || inFlight.length === 0) {
                stopHeartbeat();
                return;
            }
            probeSession(getUserinfoUrl(), function (valid) {
                if (!valid) enterSessionExpired();
            });
        }, HEARTBEAT_MS);
    }

    function stopHeartbeat() {
        if (heartbeatTimer !== null) {
            clearInterval(heartbeatTimer);
            heartbeatTimer = null;
        }
    }

    // Recovery is event-driven rather than polled: the user logs in from another
    // tab and comes back, which is exactly a focus/visibility change. Nothing
    // depends on this firing -- the retry button re-probes anyway.
    function startRecoveryWatch() {
        if (recoveryWatching) return;
        recoveryWatching = true;
        window.addEventListener('focus', recoveryProbe);
        document.addEventListener('visibilitychange', recoveryProbe);
    }

    function stopRecoveryWatch() {
        if (!recoveryWatching) return;
        recoveryWatching = false;
        window.removeEventListener('focus', recoveryProbe);
        document.removeEventListener('visibilitychange', recoveryProbe);
    }

    function recoveryProbe() {
        if (!sessionExpired) {
            stopRecoveryWatch();
            return;
        }
        // visibilitychange fires on hide as well as show.
        if (document.visibilityState === 'hidden') return;

        probeSession(getUserinfoUrl(), function (valid) {
            if (valid) exitSessionExpired();
        });
    }

    function exitSessionExpired() {
        sessionExpired = false;
        stopRecoveryWatch();
        showSessionAlert('Session restored. Click Retry remaining to finish.', true);
        updateUploadButton();
    }

    // Also the retry entry point, so there is deliberately no sessionExpired
    // guard here -- re-probing and continuing is the whole point.
    function startUpload() {
        let pendingFiles = selectedFiles.filter(f => f.status === 'pending');
        if (pendingFiles.length === 0) {
            showToast('No files to upload.', 'warning');
            return;
        }

        // Defensive: never leave two intervals alive after a retry.
        stopHeartbeat();
        uploadButton.disabled = true;
        uploadButton.innerHTML = '<i class="ti ti-loader"></i>Uploading...';

        probeSession(getUserinfoUrl(), function (valid) {
            if (!valid) {
                enterSessionExpired();
                return;
            }

            // The selection may have been cleared while the probe was in flight.
            if (selectedFiles.filter(f => f.status === 'pending').length === 0) {
                render();
                return;
            }

            // Only a positive probe clears the latch -- never clear it before,
            // or a doomed batch would start with the alert already hidden.
            sessionExpired = false;
            stopRecoveryWatch();
            hideSessionAlert();

            startHeartbeat();

            selectedFiles.forEach((item, index) => {
                if (item.status !== 'pending') return;
                try {
                    uploadFile(item, index);
                } catch (e) {
                    // One bad file must not abandon the whole loop and leave the
                    // button stuck on "Uploading...".
                    item.status = 'error';
                    item.progress = 0;
                }
            });

            render();
            checkUploadComplete();
        });
    }

    function uploadFile(item, index) {
        let uploadUrl = baseUrlValue.textContent;

        const pathParts = item.path.split('/');
        pathParts.pop(); // Remove the file name
        const folderPath = pathParts.map(part => encodeURIComponent(part)).join('/') || '';

        if (folderPath) {
            uploadUrl += (uploadUrl.endsWith('/') ? '' : '/') + folderPath;
        }

        if (!uploadUrl.endsWith('/')) {
            uploadUrl += '/';
        }

        const formData = new FormData();
        formData.append('file', item.file);

        doUpload(item, index, uploadUrl, formData);
    }

    function doUpload(item, index, url, formData) {
        // Nothing new may start once the batch has been torn down; the file stays
        // pending so the retry picks it up.
        if (sessionExpired) return;

        const xhr = new XMLHttpRequest();
        let settled = false;

        function settle() {
            if (settled) return;
            settled = true;
            const at = inFlight.indexOf(xhr);
            if (at !== -1) inFlight.splice(at, 1);
        }

        xhr.upload.addEventListener('progress', (e) => {
            if (sessionExpired) return;
            if (e.lengthComputable) {
                item.progress = (e.loaded / e.total) * 100;
                render();
            }
        });

        xhr.addEventListener('load', () => {
            settle();
            if (xhr.status === 200) {
                item.status = 'success';
                item.progress = 100;
            } else if (xhr.status === 401) {
                // Roll back to pending rather than recording a failure: the file
                // was not uploaded and must be retried once the user logs in.
                // Counting it as an error would make the retry skip it.
                item.status = 'pending';
                item.progress = 0;
                render();
                enterSessionExpired();
                return;
            } else {
                item.status = 'error';
                item.progress = 0;
            }
            render();
            checkUploadComplete();
        });

        xhr.addEventListener('error', () => {
            settle();
            item.status = 'error';
            item.progress = 0;
            render();
            checkUploadComplete();
        });

        xhr.addEventListener('abort', () => {
            settle();
            // Only roll back what we actually interrupted. Aborting a request
            // that already completed fires no abort event, but be explicit so a
            // landed 200 can never be undone.
            if (item.status === 'uploading') {
                item.status = 'pending';
                item.progress = 0;
            }
            render();
            checkUploadComplete();
        });

        inFlight.push(xhr);
        item.status = 'uploading';
        item.progress = 0;
        render();

        xhr.open('POST', url);
        xhr.send(formData);

    }

    function checkUploadComplete() {
        // Teardown in progress: the alert owns the messaging, not the summary.
        if (sessionExpired) return;
        // The batch is still running. Not merely defensive: removing a file
        // mid-flight can otherwise make the remaining files look "all done"
        // while a live request is still in the air.
        if (inFlight.length > 0) return;
        // [].every() is true, so without this an empty list reports
        // "0 files uploaded successfully" after Clear All.
        // Defensive: [].every() is true, so an empty list would otherwise report
        // "0 files uploaded successfully". Not reachable via Clear All (which
        // aborts in-flight requests first, and both the inFlight guard above and
        // synchronous abort dispatch cover that path -- verified in Chromium and
        // WebKit), but a load handler dispatched after the list is cleared would
        // hit it.
        if (selectedFiles.length === 0) return;

        const allCompleted = selectedFiles.every(f => f.status === 'success' || f.status === 'error');
        if (!allCompleted) return;

        stopHeartbeat();
        render();

        const successCount = uploadStats.success;
        const errorCount = uploadStats.errors;
        let message = `Upload complete: ${successCount} files uploaded successfully`;
        if (errorCount > 0) {
            message += `, ${errorCount} files failed`;
            showToast(message, 'error');
        } else {
            showToast(message, 'success');
        }
    }
</script>
</body>
</html>
